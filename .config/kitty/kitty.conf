# kitty config — mirrors ~/.config/alacritty/alacritty.toml

# Font
font_family      SauceCodePro Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Window
background_opacity   0.9
window_padding_width 10

# Shell
shell /usr/bin/zsh -i

# Allow image.nvim / diagram.nvim inline graphics through tmux
allow_remote_control yes
